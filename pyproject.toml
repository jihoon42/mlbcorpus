[project]
name = "mlbcorpus"
version = "0.1.0"
description = "MLB Stats API로 구축하는 야구 텍스트 코퍼스 — 언어의미와정보 팀 프로젝트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
]

[project.scripts]
mlbcorpus = "mlbcorpus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbcorpus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
