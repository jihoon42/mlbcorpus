[project]
name = "mlbcorpus"
version = "0.1.0"
description = "MLB Stats API로 구축하는 야구 텍스트 코퍼스 — 언어의미와정보 팀 프로젝트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
]

[project.scripts]
mlbcorpus = "mlbcorpus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]
# Colab 노트북 생성·오프라인 실행 검사용:  uv run --group notebooks python notebooks/build_playground.py
notebooks = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbcorpus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
