<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play-by-Word: 경기 하나로 배우는 야구 영어·스페인어</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Play-by-Word</h1>
    <p class="tag">경기 하나를 1회부터 끝까지 읽으며 야구 영어와 스페인어를 익힙니다.</p>
    <div class="langs">
      <div class="seg" role="group" aria-label="공부할 언어">
        <button data-setlang="en" aria-pressed="false">영어</button><button data-setlang="es" aria-pressed="false">스페인어</button>
      </div>
      <label class="sw"><input type="checkbox" id="both"> 두 언어 같이 보기</label>
    </div>
  </header>
  <div class="pick">
    <label for="date">경기 날짜</label>
    <input type="date" id="date">
    <div class="games" id="games" aria-live="polite"></div>
  </div>
  <div id="msg"></div>
  <div id="ghead"></div>
  <div class="layout">
    <main>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="view"></div>
    </main>
    <aside class="card idle" id="card" aria-live="polite"></aside>
  </div>
  <footer>
    문장은 MLB Stats API에서 그때그때 받아 오며 저작권은 MLB에 있습니다. 표현 사전은 2019년부터 2026년 8월까지의 기록 문장 135만 타석과 하이라이트 캡션 18만 건을 네트워크로 분석해 만들었고, 원문은 담고 있지 않습니다. 공부 기록은 이 브라우저에만 남습니다. 홍익대학교 〈언어의미와정보〉 2026-2 프로젝트.
  </footer>
</div>
<script src="lexicon.js"></script>
<script src="app.js"></script>
</body>
</html>
